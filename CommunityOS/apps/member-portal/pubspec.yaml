name: member_portal
description: CommunityOS Member Portal — Flutter application for community members.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Navigation
  go_router: ^14.2.7

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # DI
  get_it: ^8.0.2
  injectable: ^3.0.0

  # Networking
  dio: ^5.7.0
  retrofit: ^4.10.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Observability
  sentry_flutter: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^4.0.2
  json_serializable: ^6.8.0
  injectable_generator: ^3.1.3
  retrofit_generator: ^10.2.11
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

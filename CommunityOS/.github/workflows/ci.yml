name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "9.0.x"
  FLUTTER_VERSION: "3.22.0"

jobs:
  dotnet-build-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CommunityOS.sln
        working-directory: CommunityOS

      - name: Build
        run: dotnet build CommunityOS.sln --no-restore -c Release
        working-directory: CommunityOS

      - name: Unit Tests
        run: dotnet test CommunityOS.sln --no-build -c Release --filter "Category!=Integration&Category!=E2E" --collect:"XPlat Code Coverage"
        working-directory: CommunityOS

  flutter-build-test:
    name: Flutter Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [member-portal, admin-portal, public-portal]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Flutter pub get
        run: flutter pub get
        working-directory: CommunityOS/apps/${{ matrix.app }}

      - name: Flutter analyze
        run: flutter analyze
        working-directory: CommunityOS/apps/${{ matrix.app }}

      - name: Flutter test
        run: flutter test
        working-directory: CommunityOS/apps/${{ matrix.app }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: dotnet-build-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CommunityOS.sln
        working-directory: CommunityOS

      - name: Integration Tests
        run: dotnet test CommunityOS.sln --no-restore -c Release --filter "Category=Integration"
        working-directory: CommunityOS
